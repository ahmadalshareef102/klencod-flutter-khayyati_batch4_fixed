name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version
        required: true
        default: '3.47.2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.47.2' }}
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.khayyati --project-name khayyati .

      - name: Patch Android project (notifications + desugaring)
        run: python3 tool/patch_android.py

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found: $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              if [[ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]]; then
                echo "Android NDK $NDK_VERSION installed successfully"
                exit 0
              fi
            fi

            echo "NDK installation attempt $attempt failed; clearing incomplete download"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION" "$SDK_ROOT/temp"/*
            sleep 10
          done

          echo "Could not install Android NDK $NDK_VERSION after 3 attempts"
          exit 1

      - name: Remove generated Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khayyati-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
