name: khayyati
description: خياطتي - نظام إدارة محلات الخياطة والتفصيل (يعمل بدون إنترنت)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  crypto: ^3.0.5
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/pdf/
  # خط Cairo: نزّل Cairo-Regular.ttf و Cairo-Bold.ttf من fonts.google.com
  # وضعهما في assets/fonts/ ثم أزل التعليق عن الأسطر التالية (يعمل بدون إنترنت).
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
